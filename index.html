<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --color-bg: #f9f7f5;
            --color-text: #2d2a26;
            --color-accent: #c17f59;
            --color-light: #f1ece6;
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(249,247,245,0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s ease;
        }
        .logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-accent);
        }
        /* 菜单按钮 */
        .menu-btn {
            width: 30px;
            height: 24px;
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 101;
        }
        .menu-btn span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--color-text);
            transition: 0.3s;
        }
        .menu-btn span:nth-child(1) { top: 0; }
        .menu-btn span:nth-child(2) { top: 11px; }
        .menu-btn span:nth-child(3) { top: 22px; }
        /* 按钮打开动画 */
        .menu-btn.open span:nth-child(1) { transform: rotate(45deg); top: 11px; }
        .menu-btn.open span:nth-child(2) { opacity: 0; }
        .menu-btn.open span:nth-child(3) { transform: rotate(-45deg); top: 11px; }
 
        /* 全屏展开菜单 */
        .full-menu {
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            height: calc(100vh - 70px);
            background-color: rgba(249,247,245,0.97);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
        }
        .full-menu.open {
            opacity: 1;
            visibility: visible;
        }
        .full-menu a {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--color-text);
            text-decoration: none;
            transition: color 0.3s;
        }
        .full-menu a:hover {
            color: var(--color-accent);
        }
 
        /* ———— 新增：更新公告样式 ———— */
 
        .update-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }
        .update-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .update-content {
            width: 90%;
            max-width: 600px;
            max-height: 70vh;
            background-color: var(--color-bg);
            border-radius: 12px;
            padding: 25px;
            overflow-y: auto;
            position: relative;
            font-family: var(--font-sans);
            line-height: 1.8;
        }
        .update-title {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            color: var(--color-text);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-light);
        }
        .update-text {
            white-space: pre-line;
            color: #333;
            font-size: 0.95rem;
        }
        .update-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #666;
        }
        .update-close:hover {
            color: var(--color-accent);
        }
        .load-tip {
            color: #888;
            text-align: center;
            padding: 20px 0;
        }
 
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            background: linear-gradient(180deg, rgba(249,247,245,0) 0%, rgba(249,247,245,1) 100%);
        }
        .hero h1 {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }
        .hero p {
            font-size: 1.2rem;
            font-weight: 300;
            color: #666;
            margin-bottom: 3rem;
        }
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 50px;
            border: 1px solid var(--color-text);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            padding-top: 10px;
        }
        .scroll-indicator::after {
            content: '';
            width: 4px;
            height: 8px;
            background-color: var(--color-text);
            border-radius: 2px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(10px); opacity: 0.5; }
        }
        section {
            padding: 6rem 5%;
        }
        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }
        .section-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }
        .section-subtitle {
            font-size: 1rem;
            color: #888;
            font-weight: 300;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            aspect-ratio: 4/3;
            cursor: pointer;
            background-color: var(--color-light);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s ease;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .photo-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }
        .photo-item:hover img {
            transform: scale(1.05);
        }
        .category-spring { background-color: #f1ece6; }
        .category-rivers { background-color: #e8e3dd; }
        .category-plants { background-color: #f5efeb; }
        .category-ancient { background-color: #f0ebe6; }
        .category-casual { background-color: #f8f5f1; }
        footer {
            background-color: var(--color-text);
            color: #ddd;
            padding: 4rem 5% 2rem;
            text-align: center;
        }
        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }
        .footer-name {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 1rem;
        }
        .footer-contact {
            margin-bottom: 2rem;
            line-height: 2;
        }
        .footer-contact p {
            margin: 0.3rem 0;
            font-size: 0.95rem;
        }
        .footer-contact a {
            color: var(--color-accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .copyright {
            border-top: 1px solid #444;
            padding-top: 1.5rem;
            font-size: 0.85rem;
            color: #777;
        }
        @media (max-width: 768px) {
            header { padding: 1rem 5%; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
            section { padding: 4rem 5%; }
        }
        html { scroll-behavior: smooth; }
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<script>
    // 菜单展开/收起
    const menuBtn = document.getElementById('menuBtn');
    const fullMenu = document.getElementById('fullMenu');
    menuBtn.addEventListener('click', () => {
        menuBtn.classList.toggle('open');
        fullMenu.classList.toggle('open');
    });
 
    // 点击导航自动关闭菜单
    document.querySelectorAll('.full-menu a').forEach(a => {
        a.addEventListener('click', () => {
            menuBtn.classList.remove('open');
            fullMenu.classList.remove('open');
        });
    });
 
    // ———— 更新公告加载与交互 ————
    const updateBtn = document.getElementById('updateBtn');
    const updateModal = document.getElementById('updateModal');
    const updateClose = document.getElementById('updateClose');
    const updateText = document.getElementById('updateText');
 
    // 读取公告文件
    function loadUpdateAnnouncement() {
        const filePath = encodeURI('./Material/Update Announcement.txt');
        fetch(filePath)
            .then(res => {
                if(!res.ok) throw new Error('公告文件加载失败');
                return res.text();
            })
            .then(text => {
                updateText.innerHTML = text || '暂无更新公告';
            })
            .catch(err => {
                updateText.innerHTML = `<p class="load-tip">${err.message}<br>请检查文件路径是否正确</p>`;
                console.error(err);
            });
    }
 
    // 页面打开自动显示一次
    window.addEventListener('load', () => {
        updateModal.classList.add('show');
        loadUpdateAnnouncement();
    });
 
    // 菜单中点击"更新公告"
    updateBtn.addEventListener('click', (e) => {
        e.preventDefault();
        menuBtn.classList.remove('open');
        fullMenu.classList.remove('open');
        updateModal.classList.add('show');
        loadUpdateAnnouncement();
    });
 
    // 关闭公告
    updateClose.addEventListener('click', () => {
        updateModal.classList.remove('show');
    });
    updateModal.addEventListener('click', (e) => {
        if(e.target === updateModal) updateModal.classList.remove('show');
    });
 
    // 滚动渐入
    document.addEventListener('DOMContentLoaded', function(){
        const fadeElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => entry.isIntersecting && entry.target.classList.add('visible'));
        }, { threshold:0.1 });
        fadeElements.forEach(el => observer.observe(el));
    });
 
    // 图片点击放大
    document.querySelectorAll('.photo-item').forEach(item => {
        item.addEventListener('click', function(){
            const src = this.querySelector('img').src;
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;display:flex;justify-content:center;align-items:center;cursor:pointer';
            modal.innerHTML = `<img src="${src}" style="max-width:90%;max-height:90%;object-fit:contain">`;
            modal.onclick = () => modal.remove();
            document.body.appendChild(modal);
        });
    });
 
    // 导航栏阴影
    window.addEventListener('scroll', () => {
        document.querySelector('header').style.boxShadow = window.scrollY>50 ? '0 2px 10px rgba(0,0,0,0.05)' : 'none';
    });
</script>
